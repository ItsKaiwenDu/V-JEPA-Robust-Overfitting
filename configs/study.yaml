# Draft research specification. No training runner consumes this file yet.
# Null provenance/runtime fields must be resolved before confirmatory runs.
schema_version: 1
status: draft
protocol_version: "0.3"
project: vjepa-robust-overfitting

model:
  name: vjepa2_vit_large
  upstream_repository: https://github.com/facebookresearch/vjepa2
  upstream_commit: 204698b45b3712590f06245fbfba32d3be539812
  checkpoint_url: https://dl.fbaipublicfiles.com/vjepa2/vitl.pt
  checkpoint_sha256: 5346856ec9df69487fe72a25bf2632aaa8112df33fb67708e3f7374edc1f7012
  context_checkpoint_key: encoder
  target_checkpoint_key: target_encoder
  predictor_checkpoint_key: predictor
  predictor_mask_tokens: 10
  single_sequence_mask_token_index: 0
  strict_weight_loading: true
  target_update: fixed
  clean_target_input: true
  stop_target_gradient: true
  train_context_encoder: true
  train_predictor: true
  loss: native_masked_l1
  target_normalization: upstream_layer_norm
  input_mean: [0.485, 0.456, 0.406]
  input_std: [0.229, 0.224, 0.225]
  mask_distribution: upstream_vjepa2_vitl16_256px_16f

data:
  dataset: UCF101
  official_split: 1
  manifest_seed: 20261016
  manifest_directory: data/manifests/ucf101-split1-v1
  manifest_sha256: bf773c186fcff9ca255896daf601d56f3e6dece3ac404e334afff784b6726ed7
  group_disjoint: true
  videos_per_class:
    train: 20
    validation: 5
    test: 5
  budget_fallback_train_per_class: 10
  frames_per_clip: 16
  crop_size: 256
  clips_per_video: 1
  deterministic_preprocessing: true
  preprocessing_version: cfr-repair-center-4fps-16f-shortside256-centercrop-bilinear-aa-v1
  preprocessing_status: pilot_validated_not_confirmatory_locked
  cache_clean_targets: true

conditions:
  - pretrained
  - clean-finetune
  - adversarial-finetune
seeds: [0, 1, 2]

training:
  epochs: 30
  effective_batch_size: 8
  micro_batch_size: null
  mixed_precision: true
  precision_dtype: null
  perturbation_dtype: float32
  optimizer: AdamW
  encoder_lr: 0.00001
  predictor_lr: 0.0001
  weight_decay: 0.04
  warmup_epochs: 1
  lr_decay_after_epochs: [15, 23]
  lr_decay_factor: 0.1
  save_every_epochs: 1

training_attack:
  method: pgd
  norm: linf
  objective: native_masked_l1
  input_space: raw_pixels_0_1
  epsilon_255: 4
  step_size_255: 1
  steps: 5
  restarts: 1
  random_start: true
  hold_masks_within_attack: true

evaluation:
  selection_split: validation
  selection_metric: adversarial_native_loss
  selection_direction: min
  routine_every_epochs: 1
  routine_subset_size: null
  primary_epsilon_255: 4
  epsilon_sweep_255: [0, 1, 2, 4, 8]
  pgd_steps: 20
  restarts: 2
  eot_masks: 4
  step_size_255: null
  attack_mask_bank_seed: null
  scoring_mask_bank_seed: null
  scoring_masks: null
  convergence_pgd_steps: 50
  convergence_eot_masks: 8
  convergence_subset_size: null
  baselines: [random_noise, fgsm, embedding_distance_pgd]
  downstream_probe: linear
  downstream_direct_attack: true
  final_test_checkpoints: [pretrained, validation_best, final]

budget:
  currency: USD
  total_limit: 200
  compute_limit: 160
  overhead_and_contingency: 40
  preferred_rental_gpu: NVIDIA_RTX_A6000_48GB
  pilot_required: true
